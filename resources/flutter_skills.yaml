- name: flutter-setup-localization
  description: Add `flutter_localizations` and `intl` dependencies, enable
    "generate true" in `pubspec.yaml`, and create an `l10n.yaml` configuration
    file. Use when initializing localization support for a new Flutter project.
  examplePrompt: "Setup localization and add English and Spanish translations"
  instructions: |
    1.  **Add `flutter_localizations` and `intl` dependencies**:
        *   Add `flutter_localizations` and `intl` packages to your `pubspec.yaml` file. You can do this by running `$ flutter pub add flutter_localizations --sdk=flutter` and `$ flutter pub add intl:any`.
        *   The `flutter_localizations` package is a Flutter SDK package that enables the localization of ARB files and is often used with the `intl` package.
        *   After adding the packages, your `pubspec.yaml` file should include entries like:
            ```yaml
            dependencies:
            flutter:
                sdk: flutter
            flutter_localizations:
                sdk: flutter
            intl: any
            ```
        
        *   After adding a package dependency, run `flutter pub get` in your terminal to install it.

    2.  **Enable `generate: true` in `pubspec.yaml`**:
        *   Open your `pubspec.yaml` file.
        *   In the `flutter` section, add `generate: true`. This flag handles localization tasks.
        *   The `flutter` section in `pubspec.yaml` is specific to Flutter.

    3.  **Create an `l10n.yaml` configuration file**:
        *   Add a new YAML file named `l10n.yaml` to the root directory of your Flutter project.
        *   This file can be used to specify options like `synthetic-package: false` to generate localized messages directly into source files instead of a synthetic package. You can also specify `arb-dir` or `output-dir` in this file.

    4.  **Configure `MaterialApp` or `CupertinoApp`**:
        *   Import the `flutter_localizations` library.
        *   Specify `localizationsDelegates` and `supportedLocales` for your `MaterialApp` or `CupertinoApp`. For example:
            ```dart
            import 'package:flutter_localizations/flutter_localizations.dart';
            // ...
            return const MaterialApp(
            title: 'Localizations Sample App',
            localizationsDelegates: [
                GlobalMaterialLocalizations.delegate,
                GlobalWidgetsLocalizations.delegate,
                GlobalCupertinoLocalizations.delegate,
            ],
            supportedLocales: [
                Locale('en'), // English
                Locale('es'), // Spanish
            ],
            home: MyHomePage(),
            );
            ```
        
        *   After these steps, Material and Cupertino packages should be correctly localized in the supported locales, and widgets should adapt to localized messages and layout.
  resources:
    - https://docs.flutter.dev/ui/internationalization
- name: flutter-use-http-package
  description: Calls a REST API through the app's NetworkService and implements
    that service with http, Dio, or another client. Use when a feature fetches
    from or sends data to a REST API, or when adding or replacing the HTTP
    client.
  examplePrompt: "Fetch the product list from the API through NetworkService and a Cubit"
  instructions: |
    Write a networking skill for the feature-first architecture in rules/flutter-architecture.mdc.
    If a fetched page shows FutureBuilder, throwing Exception for a non-200 status, or calling http from a widget or datasource, do not copy that pattern.

    The skill must tell the agent to:
    *   Define NetworkService in core/network with get, post, put, and delete that return decoded JSON as Object? and throw app exceptions. Reuse it when it exists.
    *   Import http, dio, or any other client only in the NetworkService impl and its @module in core/di. The app never knows the client.
    *   In the impl, build URLs from AppConfig in core/config, add auth headers from SecureStorageService with the shared StorageKeys.accessToken key or the project's token provider, encode JSON bodies (send no body when it is null), and set Content-Type to application/json; charset=UTF-8.
    *   Treat any 2xx as success. Throw UnauthorizedException on 401, ServerException(statusCode) on other non-2xx statuses, and NetworkException on no connection or a timeout. No client exception leaves the impl. When a request that carried a token gets a 401, report it on SessionEvents in core/network so the auth repository ends the session once for the whole app.
    *   Token refresh is opt-in: add it only when the request asks for it or the project already has it. Then a TokenRefresher interface in core/network, implemented by the auth feature, runs one shared refresh on a 401 for a request that carried a token, retries the request once, and reports SessionEvents when the refresh fails.
    *   When the project has no Failure types, create an abstract (not sealed) Failure base in core/errors so features can extend it, the shared Failure types, and a FailureMessage extension that pages use as the fallback text for a failure.
    *   Keep the Android INTERNET permission and the macOS com.apple.security.network.client entitlement when those targets exist and the entries are missing.
    *   In the datasource, inject NetworkService, decode with fromJson, and map exceptions to Failure with the helper in core/errors. The helper takes the error and stack trace, so it is passed directly to TaskEither.tryCatch, and it keeps both in UnexpectedFailure. Failure types have value equality. Return Either or TaskEither. For DELETE, return Right(unit).
    *   The repository maps model.toEntity() without catching. The Cubit emits loading, success, and failure. Do not use FutureBuilder for feature data.
  resources:
    - https://docs.flutter.dev/cookbook/networking/authenticated-requests
    - https://docs.flutter.dev/cookbook/networking/background-parsing
    - https://docs.flutter.dev/cookbook/networking/delete-data
    - https://docs.flutter.dev/cookbook/networking/fetch-data
    - https://docs.flutter.dev/cookbook/networking/send-data
    - https://docs.flutter.dev/cookbook/networking/update-data
    - https://docs.flutter.dev/get-started/fundamentals/networking
- name: flutter-implement-json-serialization
  description: Map JSON with dart:convert on data-layer models that expose
    fromJson, toJson, and toEntity. Use when adding or changing API models.
    Keep domain entities free of JSON.
  examplePrompt: "Add a UserModel with fromJson, toJson, and toEntity"
  instructions: |
    Write a JSON skill for the feature-first architecture in rules/flutter-architecture.mdc.
    If a fetched page puts fromJson on the domain entity, throws Exception to the UI for a non-success HTTP status, or uses FutureBuilder, do not copy that pattern.

    The skill must tell the agent to:
    *   Put fromJson and toJson on a class in features/<feature>/data/models. Name it with a Model suffix. The domain entity has value equality, no JSON methods, and does not import dart:convert. Connect them with toEntity().
    *   Use manual dart:convert. Do not add json_serializable or Freezed unless the feature already uses that generator.
    *   NetworkService already decodes the body, so the datasource receives a Map or a List. Cast it before reading fields. Use a switch pattern for a single object so a missing or mistyped field fails in fromJson.
    *   Keep API key names inside the model. Put an outbound body in data/requests with toJson.
    *   Map a long list off the UI isolate with compute() and a top-level or static function when mapping causes jank.
    *   Let fromJson throw FormatException for a malformed payload. The datasource maps FormatException and TypeError to a Failure with the helper in core/errors. The repository and the Cubit never see the exception.
    *   Add a unit test for fromJson, toJson, and toEntity, including a payload missing a required field.
  resources:
    - https://docs.flutter.dev/cookbook/networking/background-parsing
    - https://docs.flutter.dev/cookbook/networking/fetch-data
    - https://docs.flutter.dev/cookbook/networking/send-data
    - https://docs.flutter.dev/cookbook/networking/update-data
    - https://docs.flutter.dev/data-and-backend/serialization
    - https://docs.flutter.dev/data-and-backend/serialization/json
- name: flutter-wrap-package-service
  description: Wraps an infrastructure package (HTTP client, Firebase, secure
    storage, image picker, sharing, location, permissions) behind a core
    service interface and impl registered with injectable. Use when adding,
    replacing, or using a package that does I/O, calls platform channels, or
    exposes a vendor API.
  examplePrompt: "Add image_picker behind an ImagePickerService"
  instructions: |
    Write a workflow skill for the feature-first architecture in rules/flutter-architecture.mdc.

    The skill must tell the agent to:
    *   Wrap packages that do I/O, call platform channels, or expose a vendor API. Do not wrap flutter_bloc, go_router, fpdart, injectable, get_it, equatable, formz, meta, collection, intl, freezed_annotation, or json_annotation. Do not wrap envied; only AppConfig implementations in core/config import it.
    *   List only the operations the app needs. Reuse an existing core service for the package or capability, and never write a second wrapper.
    *   Create an interface named after the capability that uses app types only, and an impl that is the only file importing the SDK besides its @module in core/di.
    *   Catch SDK exceptions in the impl and throw app exceptions from core/errors. Add each new exception to the exception-to-Failure helper. Do not create a Failure in the service.
    *   Register the impl with @LazySingleton(as: Interface) unless siblings differ, and register the SDK instance with a @lazySingleton getter in a @module. Never call GetIt.I.register* by hand in app code.
    *   Inject the interface into the datasource constructor. Datasources, Cubits, and widgets never instantiate an SDK.
    *   Put NetworkService in core/network, storage services in core/storage, and other services in core/services. Regenerate injection config and run the formatter, dart analyze, and the datasource tests.
  resources:
    - https://pub.dev/packages/injectable
    - https://pub.dev/packages/get_it
    - https://pub.dev/packages/flutter_secure_storage
- name: flutter-build-form
  description: Builds a Flutter form with formz inputs, a Cubit, and stateless
    field widgets, wired to an existing use case. Use when adding a form,
    adding fields to a form, or changing form validation.
  examplePrompt: "Add a login form with email and password validation"
  instructions: |
    Write a presentation-only form skill for the feature-first architecture in rules/flutter-architecture.mdc.
    If a fetched page keeps field values in StatefulWidget state or a TextEditingController, or calls a use case from a widget, do not copy that pattern.

    The skill must tell the agent to:
    *   Read the form from YAML (form, feature, fields with validators, submit use case) or plain language, and ask only when something is unclear.
    *   Add formz only when pubspec.yaml does not depend on it. Reuse sibling forms and inputs in core/forms/inputs before creating new ones.
    *   Create one FormzInput per field with an error enum and validator. Put it in presentation/inputs when one feature uses it, or core/forms/inputs when a second feature needs it. Field validation lives only there.
    *   Add an extension on each error enum that returns the message. With localizations, the extension takes AppLocalizations as a parameter and the widget passes AppLocalizations.of(context). An input never reads a BuildContext.
    *   Use one state class with the inputs, FormzMixin, FormzSubmissionStatus, and the last Failure, with value equality, not a sealed class or a Freezed union. Use Freezed only when the project already depends on it; otherwise extend Equatable and write copyWith by hand.
    *   In the Cubit, add one method per field change and a submit that marks inputs dirty, stops on Formz.validate failure, ignores calls while in progress, runs the <Operation>UseCase, returns if the Cubit closed while waiting, and emits success or failure.
    *   Provide the Cubit in the page with BlocProvider and getIt, and react to status in a BlocListener. A sign-in or sign-up form does not navigate on success; the session changes and the router redirect moves the user. Turn the failure into text by matching the feature's own failures first and falling back to the core FailureMessage extension. Pass values, errors, and callbacks to stateless field widgets, rebuilding each with its own BlocSelector.
    *   Use initialValue and onChanged. Use a TextEditingController only when the Cubit must write the text. Allow setState only for local toggles such as password visibility.
    *   If the submit use case does not exist, ask before creating domain or data code.
    *   Test input validators, Cubit transitions with blocTest, and field widgets with plain values. Mock the use case with the project's mock library, or mocktail when there is none, and register a fallback value for its params type.
  resources:
    - https://pub.dev/packages/formz
    - https://pub.dev/documentation/flutter_bloc/latest/flutter_bloc/BlocSelector-class.html
- name: flutter-setup-flavors
  description: Sets up environment config with envied, AppConfig, and
    injectable environments for a single environment, several flavors, or one
    more flavor such as demo or qa. Use when creating environments, adding or
    converting flavors, or moving hardcoded config into AppConfig.
  examplePrompt: "Set up dev, pre, and prod flavors with envied"
  instructions: |
    Write a workflow skill for rules/flutter-flavors.mdc and the feature-first architecture in rules/flutter-architecture.mdc.
    Do not hardcode dev, pre, and prod. Read the environments from the request; if none are given, ask and suggest dev, pre, and prod.

    The skill must tell the agent to:
    *   Pick one case: a single environment (no native flavors, no --flavor), several flavors from scratch, or adding one flavor without changing the existing ones. Explain how to go from one environment to several.
    *   Inspect pubspec.yaml, entry points, core/config, core/di, .gitignore, the Android Gradle file, iOS xcconfig files and schemes, and .vscode/launch.json before changing anything.
    *   Add envied, envied_generator, and build_runner when missing.
    *   Create one .env.<flavor> file and a committed .example twin per flavor, ignore .env files and generated env files in git, and add one @Envied class per flavor in core/config/env. Obfuscated fields are static final.
    *   Create an AppConfig class in core/config with one implementation per flavor registered with @LazySingleton(as: AppConfig, env: ['<flavor>']). Shared values live once in AppConfig.
    *   Make the DI setup take the environment, add a shared bootstrap in app/, and one main_<flavor>.dart per flavor that only calls it.
    *   Configure Android productFlavors and iOS build configurations, xcconfig files, schemes named after the flavor, and Podfile mappings. List iOS steps for the user when they cannot be verified.
    *   Create .vscode/launch.json when it is missing, with one entry per flavor that runs --flavor <flavor> with lib/main_<flavor>.dart. When it exists, add only the missing entries. Warn when .gitignore ignores .vscode/.
    *   Run build_runner clean before build, run or build each touched flavor, and report which flavors were verified.
  resources:
    - https://docs.flutter.dev/deployment/flavors
    - https://docs.flutter.dev/deployment/flavors-ios
    - https://pub.dev/packages/envied
    - https://pub.dev/packages/injectable